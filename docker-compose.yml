services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FRONTEND_URL=http://localhost:3000

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3000:80"
    depends_on:
      - server
