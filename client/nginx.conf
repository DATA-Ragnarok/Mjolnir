server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to the server if they are on the same domain
    # location /api {
    #     proxy_pass http://server:5001;
    # }
}
